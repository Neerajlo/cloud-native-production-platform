apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cloud-native
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: cloud-native-production-platform-api-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUBLIC_READ_ONLY
              value: "true"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8000"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8002"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cloud-native
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP