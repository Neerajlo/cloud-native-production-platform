apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloud-native
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: cloud-native-production-platform-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cloud-native
spec:
  selector:
    app: order-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP