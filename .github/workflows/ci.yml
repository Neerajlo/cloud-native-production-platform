name: Cloud Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Product Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/product-service/requirements.txt
          pip install pytest httpx

      - name: Find test files
        shell: bash
        run: |
          echo "Searching for Python test files..."
          find . -type f \( -name "test_*.py" -o -name "*_test.py" \)

      - name: Run product service tests
        shell: bash
        run: |
          TEST_FILE=$(find . -type f -name "test_product_service.py" -print -quit)
          if [ -z "$TEST_FILE" ]; then
            echo "ERROR: test_product_service.py was not found."
            exit 1
          fi
          python -m pytest -q "$TEST_FILE"

  build-and-push:
    name: Build and Push Product Service
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push product service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/product-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cloud-native-product-service:latest