name: Cloud Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Product Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/product-service/requirements.txt
          pip install pytest httpx

      - name: Show test files
        run: |
          Get-ChildItem
        shell: pwsh

      - name: Run product service tests
        run: |
          python -m pytest -q services/product-service/tests