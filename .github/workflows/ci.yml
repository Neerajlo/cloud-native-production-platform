name: Cloud Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Product Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/product-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/product-service/requirements.txt
          python -m pip install pytest httpx

      - name: Run product service tests
        run: |
          python -m pytest -q tests/test_product_service.py

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-gateway
          push: false
          tags: cloud-native-api-gateway:ci

      - name: Build Product Service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/product-service
          push: false
          tags: cloud-native-product-service:ci

      - name: Build Order Service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          push: false
          tags: cloud-native-order-service:ci