name: Cloud Native CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Product Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/product-service/requirements.txt
          pip install pytest httpx

      - name: Show test files
        run: |
          Get-ChildItem -Path services/product-service -Recurse -Filter "test*.py"
        shell: pwsh

      - name: Run product service tests
        run: |
          python -m pytest -q services/product-service/tests/test_product_service.py

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./services/api-gateway
          push: false
          tags: cloud-native-api-gateway:ci

      - name: Build Product Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/product-service
          push: false
          tags: cloud-native-product-service:ci

      - name: Build Order Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/order-service
          push: false
          tags: cloud-native-order-service:ci